# edgestash with persistent storage. Change the tokens before exposing it anywhere.
services:
  edgestash:
    build: .
    image: ghcr.io/devtechedge/edgestash:0.1.0
    ports:
      - "3333:3333"
    environment:
      EDGESTASH_PUBLIC_URL: http://localhost:3333
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_local_edgestashdevsecret
      EDGESTASH_REDIS_TOKEN: edgestash-dev-token
      EDGESTASH_ADMIN_TOKEN: edgestash-admin
      EDGESTASH_SNAPSHOT_INTERVAL_MS: "2000"
    volumes:
      - edgestash-data:/data

  # Optional: proxy Redis commands to a real Redis instead of the embedded engine.
  #   docker compose --profile redis up
  edgestash-redis-proxy:
    profiles: ["redis"]
    build: .
    ports:
      - "3334:3333"
    environment:
      EDGESTASH_PUBLIC_URL: http://localhost:3334
      EDGESTASH_REDIS_BACKEND: redis://redis:6379
      EDGESTASH_REDIS_TOKEN: edgestash-dev-token
    depends_on: [redis]
  redis:
    profiles: ["redis"]
    image: redis:7-alpine

volumes:
  edgestash-data:
